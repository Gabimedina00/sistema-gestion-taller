# Runs the whole shop system on one machine: database, cache, API, workers
# and web app. Copy .env.example to .env, fill it in, then: docker compose up -d
name: sistema-gestion-taller

x-app: &app
  build:
    context: .
    args:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3333}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  image: sistema-gestion-taller
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DB_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
    FRONTEND_URL: ${PUBLIC_APP_URL:-http://localhost:3000}

services:
  mysql:
    image: mysql:8.3.0-oraclelinux8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: ["bun", "run", "db:migrate"]
    depends_on:
      mysql:
        condition: service_healthy

  server:
    <<: *app
    command: ["node", "apps/server/dist/server.js"]
    ports:
      - "3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  workers:
    <<: *app
    command: ["node", "apps/workers/dist/index.js"]
    depends_on:
      redis:
        condition: service_healthy

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["npx", "next", "start", "-p", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mysql:
  redis:
